# ftorrent.toml — ftorrent reads this file when it starts and writes it when a setting changes, and again as it closes
# edit this file only while ftorrent isn't running: while it runs, including hidden in the tray, it writes the file once more as it closes, over any change made here
# with ftorrent not running, edit the values freely; the comments and the layout are regenerated every time, so notes of your own here will not survive

[downloads]
# where torrents go, and where ftorrent looks for the ones it already has; each folder keeps its own .ftorrent subfolder with the session data of the torrents in it. ~ is your home folder, ./ is the folder ftorrent itself is in, so a portable copy can say ./downloads and follow its own drive, and an absolute path like D:/torrents means exactly that place. Written with forward slashes on every platform, one folder to a line
folders = [
	"~/Downloads/ftorrent",
]

[trackers]
# the lists of trackers the Trackers tab reads, each a web address over https answering one tracker to a line, the way ngosang's lists, newTrackon's, and list.ftorrent.com's are written; the tab fetches each one when you check trackers there, and checks every tracker they name
lists    = [
	"https://list.ftorrent.com/trackers.txt",
	"https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_all.txt",
	"https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_all_ws.txt",
	"https://newtrackon.com/api/stable",
]
# trackers the Trackers tab checks every time, beside the ones the lists name, so a check still has trackers to try when no list can be fetched; as it ships, ftorrent's own, the WebSocket trackers browser peers depend on, since they have no DHT and find each other only through those, and a widely used UDP tracker
always   = [
	"udp://open.ftorrent.com:443/announce",
	"https://open.ftorrent.com/announce",
	"wss://open.ftorrent.com",
	"wss://tracker.webtorrent.dev",
	"wss://tracker.openwebtorrent.com",
	"wss://tracker.files.fm:7073/announce",
	"wss://tracker.novage.com.ua",
	"udp://tracker.opentrackr.org:1337/announce",
]
# the trackers that answered the last check, fastest first, which a new torrent starts from, or from always when there hasn't been a check
answered = []
# when that check ran, in UTC, like 2026nov16.1830; blank before the first
checked  = ""    # factory ""
# whether ftorrent announces to every tracker a torrent lists at once, the way qBittorrent, Transmission, and µTorrent do, or only to the first that answers, with the rest as backups, the way libtorrent does on its own and Deluge with it: "all" or "first". With "first", a browser peer, which has no DHT and finds others only through a WebSocket tracker, never meets ftorrent unless that tracker is the one answering
announce = "all" # factory "all"

[associations]
# whether ftorrent opens torrent files and links, .torrent and .ftorrent files and magnet: and ftorrent: links: "yes", "no", or "ask". Unless this is "no", a bar at the top of the window asks whenever the system opens any of them with another app, and answering yes there claims them; ftorrent never claims them on its own. The system keeps the final say, so on Windows yes may open its settings for you to confirm there. Whatever the answer, ftorrent stays in the system's Open with menu for all four
default = "ask" # factory "ask"

[login]
# whether ftorrent runs at startup, starting hidden as you log in, with only its icon near the clock: true or false, on a Mac or Windows. Choosing it in Settings, Options on Windows, also sets it in the system's own settings, Login Items & Extensions on a Mac and Startup Apps on Windows; and when the two differ, as when it's changed there or here in the file, Settings offers a link to confirm it there
start = false # factory false

[log]
# whether ftorrent keeps a log, for answering a question about what it did: true writes a file for each time ftorrent runs into ftorrent-logs in your home folder, as things happen. A log names files and links you open, so it's off unless you turn it on
record = false # factory false

[update]
# whether ftorrent asks ftorrent.com on its own which version is newest: true or false, on a Mac or Windows, and never in a portable copy. With false, it asks only when you press Check for Update. Below are when it last heard back and when it will next ask, in UTC, like 2026oct22.1830, which you can cut short to a month or a year, like 2026dec or 2027; blank next means at the next start
automatic = true # factory true
last      = ""   # factory ""
next      = ""   # factory ""

[appearance]
# light or dark: "light" or "dark" keeps ftorrent that way whatever the system is set to; "system" matches the system's own light or dark setting, and changes when it does
mode = "system" # factory "system"
# the typeface: "system" is the one the system sets its own menus and windows in, Segoe UI on Windows and San Francisco on a Mac; "inter" is Inter, with IBM Plex Mono for fixed-width text, both carried by ftorrent; "verdana" is Verdana, which drawn today looks the way Tahoma did in Windows programs around 2000, with the same Plex Mono for fixed-width text, and is offered on Windows and the Mac
font = "system" # factory "system"

[window]
# where the window was when ftorrent last closed it, so it opens there again: the position of its top left corner, then its inner size, in css pixels, which on a Mac are points and on Windows are the screen's pixels divided by its scale. ftorrent puts it back only on the screen recorded under [screen], still exactly as it was; otherwise it picks a fresh size and place. A portable copy records none of this, and opens somewhere fresh every time. Zeros mean nothing has been recorded yet
x         = 0     # factory 0
y         = 0     # factory 0
width     = 0     # factory 0
height    = 0     # factory 0
# whether the window was maximized, or zoomed on a Mac, so it opens that way again; the four numbers above are the size and place it goes to when restored
maximized = false # factory false

[screen]
# the screen the window was on when its place was recorded: its position among your screens and its size, in css pixels, then its scale as a percent, 100 for a plain screen, 200 for a Retina display, 125 for Windows set to 125%. ftorrent puts the window back only if a screen matches all five exactly, so a new resolution, scale, or rotation, or the screen unplugged or moved among the others, means a fresh place
x      = 0 # factory 0
y      = 0 # factory 0
width  = 0 # factory 0
height = 0 # factory 0
scale  = 0 # factory 0
