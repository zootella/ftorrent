# ftorrent's Windows installer, and the one file that configures it.
#
# The programs are beside this file: setup.c is the setup program a user runs, win-setup.js is the creator that builds it, and the README is the guide. The creator reads this file when pnpm installer runs on Windows. Everything else it needs it reads from the files that already say it, tauri.conf.json for the product's name, version, identifier, publisher, home page, icon, and the resources that ride beside the executable, and Cargo.toml for the executable's name, so nothing here repeats them, and a fork that renames the app in those two files gets a correct installer without touching this one.
#
# What the installer does is not configured, because the way it does it is the reason it exists: per user, into local application data under the product's name, with no page asking where; one shortcut in the Start menu; the program started at the end, every time; a running copy asked to exit before its files are replaced; and an upgrade that writes over the old files without uninstalling first, so nothing the program registered with Windows is ever taken away and given back, and a user's choice of this program for a file type survives every release. What varies between programs is what to take back on uninstall, and that is what this file holds.
#
# Three words stand for names the creator fills in: {product} is the product name as tauri.conf.json spells it, {binary} is the executable's name without .exe, and {program} is the installed executable's full path, which only the setup program knows, so it fills that one at uninstall time.

# What uninstall removes from the registry, in order, each line one instruction. The running program writes these, not the installer, when it offers itself for its file types and links and when the user says yes to opening them with it; the installer only takes them back, and only on uninstall, never on an upgrade. Every key is under HKCU, the user's own hive, which is the only one the installer touches.
#
# Five instructions, and nothing else, so the whole list can be checked against the registry editor:
#   delete-key          removes the key and everything under it
#   delete-value        removes one value; name = '' is the key's default value
#   delete-value-if     removes the value only while it still equals the text given, so a value another program has since written stays
#   delete-key-if-empty removes the key only if nothing is left in it, no values and no subkeys
#   delete-key-if       removes the key and everything under it, but only while the value named, at the subkey given by at, still equals the text given

# The listing in Settings under Default apps, taken down first, so Settings stops naming the program before the keys it points at go
[[uninstall.registry]]
delete-value = 'HKCU\Software\RegisteredApplications'
name = '{product}'

[[uninstall.registry]]
delete-key = 'HKCU\Software\{product}\Capabilities'

# The NSIS installer ftorrent shipped before this one kept the install folder and its language here; gone with the rest when it is found
[[uninstall.registry]]
delete-key = 'HKCU\Software\{product}\{product}'

[[uninstall.registry]]
delete-key-if-empty = 'HKCU\Software\{product}'

# The .torrent file type: the program's own ProgID, its place in the list of programs offered for the extension, the extension's default while it still names the program, and the extension's keys if that leaves them empty
[[uninstall.registry]]
delete-key = 'HKCU\Software\Classes\{product}.torrent'

[[uninstall.registry]]
delete-value = 'HKCU\Software\Classes\.torrent\OpenWithProgids'
name = '{product}.torrent'

[[uninstall.registry]]
delete-value-if = 'HKCU\Software\Classes\.torrent'
name = ''
equals = '{product}.torrent'

[[uninstall.registry]]
delete-key-if-empty = 'HKCU\Software\Classes\.torrent\OpenWithProgids'

[[uninstall.registry]]
delete-key-if-empty = 'HKCU\Software\Classes\.torrent'

# The .ftorrent file type, the same moves
[[uninstall.registry]]
delete-key = 'HKCU\Software\Classes\{product}.{product}'

[[uninstall.registry]]
delete-value = 'HKCU\Software\Classes\.{product}\OpenWithProgids'
name = '{product}.{product}'

[[uninstall.registry]]
delete-value-if = 'HKCU\Software\Classes\.{product}'
name = ''
equals = '{product}.{product}'

[[uninstall.registry]]
delete-key-if-empty = 'HKCU\Software\Classes\.{product}\OpenWithProgids'

[[uninstall.registry]]
delete-key-if-empty = 'HKCU\Software\Classes\.{product}'

# The magnet: link: the program's own ProgID whole, and the shared class named for the scheme only while its command still runs the program; another client that has taken the class since keeps it
[[uninstall.registry]]
delete-key = 'HKCU\Software\Classes\{product}.url.magnet'

[[uninstall.registry]]
delete-key-if = 'HKCU\Software\Classes\magnet'
at = 'shell\open\command'
name = ''
equals = '"{program}" "%1"'

# The ftorrent: link, the same two moves
[[uninstall.registry]]
delete-key = 'HKCU\Software\Classes\{product}.url.{product}'

[[uninstall.registry]]
delete-key-if = 'HKCU\Software\Classes\{product}'
at = 'shell\open\command'
name = ''
equals = '"{program}" "%1"'

# The executable's own entry under Applications, with the types it said it supports
[[uninstall.registry]]
delete-key = 'HKCU\Software\Classes\Applications\{binary}.exe'

# Start at login, the value a program puts under Run to start with Windows; ftorrent does not write one yet, and when it does this takes it back
[[uninstall.registry]]
delete-value = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run'
name = '{product}'
