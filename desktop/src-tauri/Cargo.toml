[package]
name = "ftorrent"
version = "0.1.0"
description = "Next-generation client for the decentralized web"
# becomes the .deb's Maintainer field, public in every installed copy, so the project rather than a person; ftorrent has no mailbox yet, so the site stands in for one
authors = ["ftorrent <https://ftorrent.com/>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ftorrent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }#tray-icon for the tray lifecycle.rs builds on windows
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["net", "io-util"] }#the named pipe a second launch hands over through; tauri already brings tokio, and this turns on the part that speaks pipes
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_Security", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }#the registry calls registry.rs makes and the shell notification after them, the hidden attribute disk.rs sets, and the small icon size lifecycle.rs asks for the tray; tauri already brings this crate at this version, and Win32_Security is here because RegCreateKeyExW takes a security attributes pointer
ico = "0.5"#reads the tray icons at startup, so lifecycle.rs can hand the shell the layer drawn for the system's scaling; tauri already brings this crate at this version, inside its code generator
webview2-com = "0.38"#the web view's key event, which window.rs handles to turn off the browser's shortcut keys; tauri already brings this crate at this version, and the controller tauri hands over is its type

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"#calling objective-c from rust, and Retained, the reference these calls hand back; tauri already brings this crate at this version
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "block2", "objc2-uniform-type-identifiers"] }#NSWorkspace, which launch.rs asks what opens a type or a link and tells which app should; tauri already brings this crate at this version
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSError"] }#the strings, urls, and errors those calls take and give; already in the tree too
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["std", "UTType"] }#the type a file extension names, which NSWorkspace takes for a file; the one crate here tauri doesn't already bring, from the same family at the same version
block2 = "0.6.2"#the completion handler NSWorkspace calls once a default is set; already in the tree
