[package]
name = "ftorrent"
version = "0.1.0"
description = "Next-generation client for the decentralized web"
# becomes the .deb's Maintainer field, public in every installed copy, so the project rather than a person; ftorrent has no mailbox yet, so the site stands in for one
authors = ["ftorrent <https://ftorrent.com/>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ftorrent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.11", features = ["tray-icon"] }#held to 2.11, the minor the page's @tauri-apps/api and cli match, so a plugin can't pull the framework forward on its own; tray-icon for the windows tray and the mac menu bar icon lifecycle.rs builds
open = { version = "5", features = ["shellexecute-on-windows"] }#opens a file or an address with the program the system has for it, for process_open: ShellExecuteEx on windows, which the feature turns on in place of a powershell process, /usr/bin/open on a mac, and xdg-open on linux; tauri's opener plugin is a wrapper over this crate
tauri-plugin-dialog = "2"#for its Rust half alone, the system's open and save boxes dialog.rs puts up off the mac, where AppKit's are called directly; the page is granted none of it, and it brings rfd, the crate that talks to each system's box
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"#the https requests net.rs makes for the page, with its default TLS, rustls and Mozilla's roots compiled in
getrandom = "0.3"#the random transaction id net.rs puts in a STUN request; tauri already brings this crate at this version
igd-next = { version = "0.18", features = ["ipv6"] }#UPnP's mechanics for net.rs: the search that finds a router, then its external address and its port mappings over SOAP, blocking through attohttpc by default; its ipv6 feature adds the WANIPv6FirewallControl service to the gateway it finds, with the firewall status read and the pinhole calls on it, and brings no crate of its own; iroh's port mapper and libp2p build their UPnP on it too
natpmp = { version = "0.5", default-features = false }#NAT-PMP's mechanics for net.rs: the public address request to a gateway, answered with the router's external address and its epoch; without its default tokio feature, since net.rs blocks on run_blocking's pool, and it brings netdev for a gateway lookup net.rs passes over, since the page names the gateway
dunce = "1"#writes a Windows path the plain way, C:\ rather than \\?\C:\, the verbatim form canonicalize puts on a path and Tauri's current_exe passes along; paths.rs writes every path for the page through it, so the firewall, which stores plain paths, and a person both recognize them; nothing to do on a mac or linux, and tauri already brings this crate at this version
zootella-ergo = "0.2.0"#ergo's small helpers, the same in rust as in the page: log.rs writes its time stamps through say_tick's templates and tick_to_iso, asking has_tick first; the size constants count out buffers; and net.rs hashes a saved download with its Sha256 and writes bytes as text with Data's base16; its sha2 is a generation newer than the one tauri's code generator brings at build time, so the lockfile holds both, and it brings sha1, blake3, and unicode-normalization too, which nothing here calls

[target.'cfg(unix)'.dependencies]
libc = "0.2"#statvfs, which disk.rs asks how much room a volume has, and getifaddrs, which net.rs lists the interfaces through; tauri already brings this crate at this version

[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["net", "io-util"] }#the named pipe a second launch hands over through; tauri already brings tokio, and this turns on the part that speaks pipes
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_Security", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_NetworkManagement_WindowsFirewall", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }#the registry calls registry.rs makes and the shell notification after them, the hidden attribute disk.rs sets, the small icon size lifecycle.rs asks for the tray, the keys window.rs asks whether are held, GetAdaptersAddresses, which net.rs lists the interfaces through, with the status and socket address types its answer is written in, and the firewall's COM interface firewall.rs reads, with COM itself, the enumerator its rule collection is walked by, and the VARIANT each rule arrives in; tauri already brings this crate at this version, and Win32_Security is here because RegCreateKeyExW takes a security attributes pointer
ico = "0.5"#reads the tray icons at startup, so lifecycle.rs can hand the shell the layer drawn for the system's scaling; tauri already brings this crate at this version, inside its code generator
webview2-com = "0.38"#the web view's key event, which window.rs handles to turn off the browser's shortcut keys; tauri already brings this crate at this version, and the controller tauri hands over is its type

[target.'cfg(target_os = "macos")'.dependencies]
tokio = { version = "1", features = ["time"] }#the timeout launch.rs puts on waiting for macOS's answer; tauri already brings tokio, and this turns on the part that keeps time
objc2 = "0.6.4"#calling objective-c from rust, and Retained, the reference these calls hand back; tauri already brings this crate at this version
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "block2", "objc2-uniform-type-identifiers", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSWindow", "NSPanel", "NSSavePanel", "NSOpenPanel"] }#NSApplication, with NSResponder above it, NSMenu, and NSMenuItem, through which lifecycle.rs reaches the menu bar for the page, graying and lighting the Edit menu's items and turning AppKit's own asking back on for the View menu; NSWorkspace, which launch.rs asks what opens a type or a link and tells which app should; NSOpenPanel and NSSavePanel, with NSPanel and NSWindow above them, the open and save boxes dialog.rs slides down from the window; tauri already brings this crate at this version
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSError", "NSArray", "NSAppleEventManager", "NSAppleEventDescriptor"] }#the strings, urls, errors, and arrays those calls take and give, the array carrying the file types dialog.rs lets the open panel offer, and the apple event a launch arrives with, which login.rs reads to know a login item started this process; already in the tree too
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["std", "UTType"] }#the type a file extension names, which NSWorkspace takes for a file and the open panel filters by; one of the two crates here tauri doesn't already bring, both from the same family at the same version
block2 = "0.6.2"#the completion handler NSWorkspace calls once a default is set; already in the tree
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }#SMAppService, through which login.rs makes this app a login item and asks whether it is one; the other crate tauri doesn't already bring, from the same family at the same version
