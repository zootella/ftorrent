[package]
name = "ftorrent"
version = "0.1.0"
description = "Next-generation client for the decentralized web"
# becomes the .deb's Maintainer field, public in every installed copy, so the project rather than a person; ftorrent has no mailbox yet, so the site stands in for one
authors = ["ftorrent <https://ftorrent.com/>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ftorrent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }#tray-icon for the tray lifecycle.rs builds on windows
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["net", "io-util"] }#the named pipe a second launch hands over through; tauri already brings tokio, and this turns on the part that speaks pipes
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_Security", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }#the registry calls registry.rs makes and the shell notification after them, and the hidden attribute disk.rs sets; tauri already brings this crate at this version, and Win32_Security is here because RegCreateKeyExW takes a security attributes pointer

