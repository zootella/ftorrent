#cloud-config
# moon's user data, pasted into the provider's dashboard when creating the box. Debian 13, with every service a package and a systemd unit; the runbook says why there is no container runtime here.

hostname: moon
timezone: Etc/UTC
ssh_pwauth: false
disable_root: false

package_update: true
package_upgrade: true
package_reboot_if_required: true
packages:
  - caddy
  - unattended-upgrades
  - rsync

write_files:
  # Daily unattended upgrades from security and updates, and a restart at 04:00 UTC when one is needed. Debian's own file already names the security archive; this adds the updates archive. dpkg keeps our edited Caddyfile when a caddy update ships its own.
  - path: /etc/apt/apt.conf.d/52moon
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      Unattended-Upgrade::Allowed-Origins:: "${distro_id}:${distro_codename}-updates";
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";
      Dpkg::Options:: "--force-confdef";
      Dpkg::Options:: "--force-confold";
  # moon's IPv6 address is the first in its /64. A SLAAC address is the /64 the router advertises plus an interface identifier the box chooses, and the provider's suggested identifier is formed from the MAC, so it changes with every new instance. A token of ::1 makes networkd form <the /64>::1 instead, with no address written here, so the AAAA records survive a rebuild that keeps the /64; the provider's address stays on the interface beside it. ens2 is the interface in the provider's own netplan file, and this drop-in has to name the same one.
  - path: /etc/netplan/60-moon.yaml
    permissions: '0600'
    content: |
      network:
        version: 2
        ethernets:
          ens2:
            ipv6-address-token: "::1"

# The drop-in above lands after the network is up, so apply it now rather than at the next reboot.
runcmd:
  - netplan apply
