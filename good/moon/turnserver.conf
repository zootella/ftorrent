# moon's coturn configuration, deployed to /etc/turnserver.conf, where Debian's coturn package reads it. STUN binding over UDP 3478 on both families and nothing else: the same options the main server runs, with the pidfile left to the unit, which passes none, and the log to stdout, which systemd carries into the journal.

# STUN's registered port, on every address the box has.
listening-port=3478

# STUN only. stun-only refuses every TURN allocation, and it alone makes this a reflector and never a relay. One transport, UDP: the TCP, TLS, and DTLS listeners are off, and RFC 5780, the NAT behavior discovery that would bind a second port, is off as well.
stun-only
no-tcp
no-tls
no-dtls
no-rfc5780

# A binding request needs no credentials.
no-auth

# coturn wants a realm even in stun-only mode.
realm=moon.ftorrent.com

# No command-line interface, no multicast peers, and a FINGERPRINT attribute on every answer.
no-cli
no-multicast-peers
fingerprint
log-file=stdout

# The answer is XOR-MAPPED-ADDRESS and FINGERPRINT alone, as the main server's is. This version adds three more by default, and these lines turn them off: MAPPED-ADDRESS, the 2003 form of the same address, which only a client from before RFC 5389 needs; RESPONSE-ORIGIN, which only the NAT behavior discovery of RFC 5780 reads, and that is off above; and SOFTWARE, the server's name and version, twenty bytes that tell a client nothing it needs and would make every answer half again as large.
no-stun-backward-compatibility
response-origin-only-with-rfc5780
no-software-attribute
