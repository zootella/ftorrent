# moon's coturn configuration, deployed to /etc/turnserver.conf, where Debian's coturn package reads it. STUN binding over UDP 3478 on both families and nothing else: the same options the main server runs, with the pidfile left to the unit, which passes none, and the log to stdout, which systemd carries into the journal. Each option is a line of its own, a name or a name=value, and so is each comment.

#STUN's registered port, on every address the box has
listening-port=3478

#STUN only, refusing every TURN allocation, which alone makes this a reflector and never a relay
stun-only
#one transport, UDP: no TCP listener
no-tcp
#no TLS listener, the encrypted form over TCP
no-tls
#no DTLS listener, the encrypted form over UDP
no-dtls
#no RFC 5780, the NAT behavior discovery that would bind a second address and port and answer from them
no-rfc5780

#a binding request needs no credentials
no-auth

#coturn wants a realm, the name TURN's credentials are scoped to, even in stun-only mode
realm=moon.ftorrent.com

#no command-line interface, coturn's console on a local port
no-cli
#no relaying to broadcast and multicast addresses, which only TURN would do, and costs nothing to say
no-multicast-peers
#a FINGERPRINT attribute on every answer, a checksum a client can use to tell a STUN packet from other traffic on the same port
fingerprint
#the log to stdout, which systemd carries into the journal
log-file=stdout

#the answer is XOR-MAPPED-ADDRESS and FINGERPRINT alone, as the main server's is. This version adds three more by default, and the three lines below turn them off
#MAPPED-ADDRESS, the 2003 form of the same address, which only a client from before RFC 5389 needs; this also stops answering requests in that older form, which a current client never sends
no-stun-backward-compatibility
#RESPONSE-ORIGIN, the address the answer left from, which only RFC 5780's discovery reads, and that is off above
response-origin-only-with-rfc5780
#SOFTWARE, the server's name and version, twenty bytes that tell a client nothing it needs and would make every answer half again as large
no-software-attribute
