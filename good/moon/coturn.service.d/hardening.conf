# The hardening the main server's compose file gives its coturn container, as systemd directives in a drop-in beside Debian's own unit, which runs coturn as the turnserver user already. Deployed to /etc/systemd/system/coturn.service.d/hardening.conf; a package upgrade replaces the unit and leaves this in place.
[Service]
# The filesystem read-only, apart from coturn's own state folder, /var/lib/turn, where it opens its user database at start even in stun-only mode; and no view of home folders, devices, or other processes.
ProtectSystem=strict
StateDirectory=turn
ProtectHome=yes
PrivateDevices=yes
ProtectProc=invisible
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
# No capabilities at all: 3478 is above the privileged ports, so binding it needs none. And no way to gain any.
CapabilityBoundingSet=
AmbientCapabilities=
NoNewPrivileges=yes
RestrictSUIDSGID=yes
# Sockets of the two internet families, plus the two the process needs to run at all: netlink, which getifaddrs uses to discover the addresses to listen on, and without which coturn finds none and exits; and Unix, which carries its readiness notice to systemd. Then the system calls an ordinary service uses; anything else fails with a permission error rather than killing the process.
RestrictAddressFamilies=AF_INET AF_INET6 AF_NETLINK AF_UNIX
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
SystemCallArchitectures=native
RestrictNamespaces=yes
RestrictRealtime=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
# The compose file's limits: 128 MB of memory, half a core, 64 tasks.
MemoryMax=128M
CPUQuota=50%
TasksMax=64
