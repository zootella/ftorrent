# The hardening the main server's compose file gives its coturn container, as systemd directives in a drop-in beside Debian's own unit, which runs coturn as the turnserver user already. Deployed to /etc/systemd/system/coturn.service.d/hardening.conf; a package upgrade replaces the unit and leaves this in place. systemd reads every file in a unit's .d folder after the unit itself and lays each setting over the unit's, and a comment is a line of its own, starting with #.
[Service]
#the whole filesystem read-only for coturn, /usr, /boot, and /etc included
ProtectSystem=strict
#apart from /var/lib/turn, coturn's own state folder, which systemd makes and gives to coturn's user; coturn opens its user database there at start, even in stun-only mode
StateDirectory=turn
#home folders hidden, as though empty
ProtectHome=yes
#a private /dev with only the harmless devices, like /dev/null, and no hardware
PrivateDevices=yes
#other processes hidden in /proc, so coturn sees only its own
ProtectProc=invisible
#the kernel's tunables, in /proc/sys and /sys, read-only
ProtectKernelTunables=yes
#no loading kernel modules
ProtectKernelModules=yes
#no reading the kernel's log
ProtectKernelLogs=yes
#the kernel's control groups, where systemd keeps every service's limits, read-only
ProtectControlGroups=yes
#no setting the system clock
ProtectClock=yes
#no changing the hostname
ProtectHostname=yes
#no capabilities at all, the slices of root's power a process can hold one at a time, since 3478 is above the privileged ports, the ones below 1024, and binding it needs none
CapabilityBoundingSet=
AmbientCapabilities=
#and no way to gain any, through a setuid program or otherwise
NoNewPrivileges=yes
#nor to make a file setuid or setgid
RestrictSUIDSGID=yes
#sockets of the two internet families, plus the two the process needs to run at all: netlink, which getifaddrs uses to find the addresses to listen on, and without which coturn finds none and exits; and Unix, which carries its readiness notice to systemd
RestrictAddressFamilies=AF_INET AF_INET6 AF_NETLINK AF_UNIX
#the system calls an ordinary service uses, systemd's @system-service set, and no others
SystemCallFilter=@system-service
#a call outside the set fails with a permission error rather than killing the process
SystemCallErrorNumber=EPERM
#the box's own instruction set only, so no 32-bit system call slips around the filter
SystemCallArchitectures=native
#no new namespaces, the kernel's way of giving a process a private network or filesystem of its own
RestrictNamespaces=yes
#no realtime scheduling, which could starve everything else on the box
RestrictRealtime=yes
#no switching the kernel's execution personality, an old way of changing how system calls behave
LockPersonality=yes
#no memory both writable and executable, which code injected at run time needs
MemoryDenyWriteExecute=yes
#the compose file's limits: 128 MB of memory, half a core, and 64 tasks, the processes and threads together
MemoryMax=128M
CPUQuota=50%
TasksMax=64
