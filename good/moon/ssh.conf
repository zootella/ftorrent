# moon's ssh settings: a Host block named moon, read with ssh -F by deploy.py and firewall.py, and by hand as ssh -F good/moon/ssh.conf moon. HostName is moon's public IPv4, which stays with the box and is what moon.ftorrent.com resolves to. Put your own box's address here; get it from the box's page in your provider's dashboard. A comment is a line of its own, starting with #.
#the settings below apply when ssh is asked for the host moon
Host moon
	#the address ssh connects to
	HostName 51.15.65.58
	#log in as root, which cloud-init leaves open to the key
	User root
	#the private key made for moon alone
	IdentityFile ~/.ssh/moon
	#offer only that key, never every key an agent holds, which a box counts against its limit of failed tries
	IdentitiesOnly yes
	#moon's host key kept in a file of its own, so a rebuild's new key is one line to clear
	UserKnownHostsFile ~/.ssh/moon_known_hosts
	#take the host key on the first connection without asking, and refuse a changed one after
	StrictHostKeyChecking accept-new
