# moon's ssh settings: a Host block named moon, read with ssh -F by deploy.py and firewall.py, and by hand as ssh -F good/moon/ssh.conf moon. HostName is moon's public IPv4, which stays with the box and is what moon.ftorrent.com resolves to. Put your own box's address here; get it from the box's page in your provider's dashboard.
Host moon
	HostName 51.15.65.58
	User root
	IdentityFile ~/.ssh/moon
	IdentitiesOnly yes
	UserKnownHostsFile ~/.ssh/moon_known_hosts
	StrictHostKeyChecking accept-new
