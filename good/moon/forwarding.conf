# Turns on IPv4 forwarding, so moon passes packets between the two network namespaces' veth pairs and ens2, under the FORWARD rules in rules.v4, which admit only the namespaces' own traffic. firewall.py copies this to /etc/sysctl.d/60-forwarding.conf and loads it, and systemd-sysctl loads it at every boot. IPv4 alone, since the namespaces translate IPv4 alone, and since a box forwarding IPv6 counts as a router, which takes no router advertisements, and moon's IPv6 address comes from those.
net.ipv4.ip_forward = 1
