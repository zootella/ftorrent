# Turns on forwarding in both families, so moon passes packets between its network namespaces' veth pairs and ens2, under the FORWARD rules in rules.v4 and rules.v6, which admit only the namespaces' own traffic and the answers to it. firewall.py copies this to /etc/sysctl.d/60-forwarding.conf and loads it, and systemd-sysctl loads it at every boot. A box forwarding IPv6 counts as a router, which would stop taking router advertisements, and moon's own ::1 comes from those, so the netplan drop-in cloud-init writes says accept-ra outright to keep taking them.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
#answer neighbor discovery for the addresses namespaces.py lists as proxy entries on ens2, which is how the provider's router finds the firewall namespace's peer on the link. It's set for all interfaces rather than for ens2, since networkd sets each interface's own proxy_ndp from its own configuration and would set ens2's back to 0, and the kernel answers when either is on; only the listed addresses are answered for
net.ipv6.conf.all.proxy_ndp = 1
