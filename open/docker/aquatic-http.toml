# Aquatic HTTP tracker configuration
# See: https://github.com/greatest-ape/aquatic/tree/master/crates/http
#
# Generated from aquatic_http v0.9.0 defaults with modifications noted below.

# Changed from default 1 to 2. A socket worker accepts connections, parses each announce, and writes the answer. It is one thread, and a thread runs on one core at a time, however idle the rest of the machine is. One worker's core fills at about the HTTPS rate where the gauge's breakers trip, and past that point the served rate levels off at what one core can do, so the breaker may never trip, and requests slow and time out at the proxy instead. Two workers put that limit well beyond the breakers. Each opens its own socket on the same port (SO_REUSEPORT), and the kernel spreads connections across them. With a proxy that opens a fresh connection for each request, as HAProxy does with option http-server-close, that spreads announces evenly; a proxy that holds a few backend connections open for many requests can split them unevenly. Raise this together with the HTTPS ceilings in the gauge's SERVICE_BREAKERS.
socket_workers = 2

# The swarm worker holds the table of torrents and peers. It does a small share of each announce and stays far from filling its core.
swarm_workers = 1

log_level = "warn"

[network]
# Changed from default ":3000" to match our container port.
# Listen on all IPv4 interfaces. When running behind a reverse proxy
# on the host, the proxy handles IPv4/IPv6 from the outside and
# connects to this container over the internal Docker bridge, which
# is IPv4.
address = "0.0.0.0:8081"
only_ipv6 = false
tcp_backlog = 1024
keep_alive = true

# TLS is handled by the reverse proxy, not by Aquatic.
enable_tls = false

# Changed from default false. When running behind a reverse proxy,
# trust X-Forwarded-For to get the client's real IP address.
runs_behind_reverse_proxy = true
reverse_proxy_ip_header_name = "X-Forwarded-For"
reverse_proxy_ip_header_format = "last_address"

[protocol]
max_scrape_torrents = 100
max_peers = 50
# Seconds between announces that clients should respect.
# Changed from Aquatic default 120 to 1800 to match opentracker's 30-minute
# norm. The 2-minute Aquatic default is well outside the BitTorrent ecosystem
# norm — see the guide section "Announce intervals and peer lifecycle".
peer_announce_interval = 1800

[cleaning]
torrent_cleaning_interval = 30
connection_cleaning_interval = 60
# Max age of a peer entry before cleanup (seconds).
# Changed from Aquatic default 1800 to 3600 (2× peer_announce_interval),
# the conservative norm — one missed announce of grace before eviction.
max_peer_age = 3600
max_connection_idle = 180

[privileges]
drop_privileges = false

[access_list]
mode = "off"

[metrics]
# Changed from default false.
run_prometheus_endpoint = true
prometheus_endpoint_address = "0.0.0.0:9000"
torrent_count_update_interval = 10
