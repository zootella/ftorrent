
packages:

	# Note our rule is: If it's got a package.json, we make it a workspace
	# Pure Docker 🐳, pure win32 🖥️, just notes 📒? those are just folders

  # ftorrent.com — project homepage, download links, overview
  - site

  # docs.ftorrent.com — VitePress documentation site
  - docs

  # open.ftorrent.com — public BitTorrent, WebTorrent, and WebRTC tracker
  - open/page    # Vue+Vite frontend, built on Mac, rsynced to server, served by the reverse proxy
  # open/gauge is pure Python in Docker (no package.json) — per the rule above, just a folder, not a workspace

  # good.ftorrent.com — IPv4/IPv6 connectivity diagnostic tool
  - good
  - good/page    # the page's workspace: a placeholder that uploads good/static/index.html until Good2a builds the page here

  # Desktop BitTorrent and WebTorrent client (Tauri) for Mac, Windows, and Linux
  - desktop
  # its Linux packages, built on a Mac in Docker containers; nested inside the desktop folder, so cd deeper only to make a release
  - desktop/linux

# esbuild's install script only swaps its node launcher for the native binary, which arrives anyway as @esbuild/<platform>, so every workspace skips it on purpose, and naming it here keeps pnpm from asking
ignoredBuiltDependencies:
  - esbuild
