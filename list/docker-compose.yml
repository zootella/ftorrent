# Compose file for the tracker checker at list.ftorrent.com: two containers built from libtorrent-list/, one on a network with IPv4 only and one on a network with IPv6 only, so each checks every tracker in its own family and libtorrent has no choice of family to make.
#
# Both run list.py, which sleeps to the top of each hour, checks, and records into one SQLite file in the data folder they share. The IPv4 one also publishes: before checking, it writes the hour that just ended to data/public/trackers.txt and data/public/trackers.json, which the web server serves at list.ftorrent.com.
#
# Nothing comes in: no ports are published. Each container needs outbound UDP and TCP to any address and port, since trackers listen wherever they like, so the host's firewall needs an exception for the two pinned addresses below, each in its own family. Docker translates both networks' private addresses to the server's public ones on the way out, IPv6 included.
#
# The data folder beside this file must be writable by UID 65534:
#   sudo mkdir -p /opt/list.ftorrent.com/data
#   sudo chown -R 65534:65534 /opt/list.ftorrent.com/data
#
# Start, from the folder this file is in:
#   docker compose up -d --build

name: ftorrent-list

services:

  libtorrent-list4:
    build: ./libtorrent-list
    container_name: ftorrent-list4-1
    networks:
      list4:
        ipv4_address: 172.30.6.2
    environment:
      - LIST_FAMILY=4
      - LIST_REPORT=1   # this one also publishes the report
      - LIST_DIR=/list
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp   # libtorrent's scratch, and Python's temporary folder
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/list
    ulimits:
      # every socket counts as an open file. A pass holds at most libtorrent's fifty HTTP announces at a time, a socket for each WebSocket tracker, and one UDP socket all the UDP trackers share: 109 open files at its peak on Docker Desktop, growing slowly with the lists. 4096 is more than 30 times that, against the kernel's own ceiling of a million for each process
      nofile:
        soft: 4096
        hard: 4096
    deploy:
      resources:
        # each limit below sits in the middle of a wide margin: far above what the container needs, so normal running never comes near one and nothing inside breaks against it, and far below what the server can give without noticing, so a runaway stops here instead of reaching the machine and everything else it runs
        limits:
          memory: 500m   # a pass peaked at 55 MiB, and publishing from 18 months of history for 300 trackers at 17 MiB; the server sets nothing aside for a ceiling until it's used, and it's 500 rather than 512, the DHT node's, which is how the gauge tells that container apart
          cpus: '4'      # a pass takes 1.25 seconds of CPU over its minute, in bursts near 0.6 of one CPU; a runaway loop gets four CPUs' time while the rest of the machine keeps its own, and a CPU limit only slows a process, so a burst past it would cost a pass a moment, never an outcome
          # libdatachannel, the WebRTC library libtorrent runs for WebSocket trackers, starts a worker thread for each CPU the machine has and keeps them for the life of the process, and nothing in libtorrent's settings caps that. A pass holds the CPU count plus eight threads, so on a server with dozens of CPUs the hourly process and a pass by hand beside it come to around a hundred; 4096 is many times that on any machine, and each thread's kernel memory counts against the memory limit above, so a runaway's threads can't reach past it either
          pids: 4096
    restart: unless-stopped

  libtorrent-list6:
    build: ./libtorrent-list   # the same build as the IPv4 service, so the second comes from cache
    container_name: ftorrent-list6-1
    networks:
      list6:
        ipv6_address: fd00:cafe:8::2
    environment:
      - LIST_FAMILY=6
      - LIST_DIR=/list
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/list
    ulimits:   # the same limits as the IPv4 service, for the same reasons
      nofile:
        soft: 4096
        hard: 4096
    deploy:
      resources:
        limits:
          memory: 500m
          cpus: '4'
          pids: 4096
    restart: unless-stopped

networks:

  list4:
    name: ftorrent-list4
    ipam:
      config:
        - subnet: 172.30.6.0/24

  list6:
    name: ftorrent-list6
    enable_ipv4: false   # a network with IPv6 only, which Docker Engine 28 and later can make
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:cafe:8::/64
